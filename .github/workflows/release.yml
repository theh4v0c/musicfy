name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test bin/unit.mjs
      - run: node bin/design-check.mjs
      - name: source archive
        run: |
          set -eu
          NAME="musicfy-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="$NAME/" -o "$NAME.tar.gz" HEAD
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            See CHANGELOG.md for the changes in this release.
            Install with the instructions in README.md.
          files: |
            musicfy-*.tar.gz
            musicfy-*.tar.gz.sha256
