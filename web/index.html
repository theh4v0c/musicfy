<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>MUSICFY</title>
<link rel="stylesheet" href="/app.css?v=473">
</head>
<body>
<div id="app">

  <aside class="sidebar">
    <div class="brand-row"><div class="brand">MUSICFY</div><div class="brand-mini" aria-label="MUSICFY">MF</div><button class="side-icon" id="side-collapse" title="Hide sidebar" aria-label="Hide sidebar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
    <nav class="snav">
      <button class="snav-btn on" data-nav="home">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg>
        Home</button>
      <button class="snav-btn" data-nav="search">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Search</button>
      <button class="snav-btn" data-nav="askai">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.5l-1.9-5.7L4.5 10.9 10.1 9z"/><path d="M18.5 16.5 19.4 19l2.5.9-2.5.9-.9 2.5-.9-2.5-2.5-.9 2.5-.9z" opacity=".7"/></svg>
        A&amp;R</button>
      <button class="snav-btn" data-nav="songs">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="15" r="2.5"/><path d="M8.5 18V7l11-2v10"/></svg>
        Library</button>
      <button class="snav-btn" data-nav="library">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M9 4v16M14 5l5 15"/></svg>
        Playlists</button>
      <button class="snav-btn" data-nav="djexport">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
        <span class="snav-label">Prep</span>
      </button>
      <button class="snav-btn" data-nav="settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5 5l2.3 2.3M16.7 16.7 19 19M19 5l-2.3 2.3M7.3 16.7 5 19"/></svg>
        <span class="snav-label">Settings</span>
      </button>

    </nav>
    <div class="slib-label">PLAYLISTS <em id="pl-count"></em></div>
    <div class="slib" id="slib"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="back" hidden aria-label="Back">&#8592;</button>
      <div class="view-title" id="view-title"></div>
      <button class="icon-btn" id="dl-btn" title="Downloads" aria-label="Downloads">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
      </button>
      <button class="icon-btn" id="queue-btn" title="Queue" aria-label="Queue">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/><path d="m17 14 4 3-4 3z" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="selhost" id="selhost"></div>
      <div class="pill" id="pill" title="Tracks in the library and audio on disk"></div>
    </header>
    <div class="view" id="view"></div>
  </main>

  <aside class="queue-drawer" id="queue-drawer" hidden>
    <div class="q-head">
      <div class="q-title-lg">Queue</div>
      <button class="icon-btn" id="queue-close" aria-label="Close queue">&times;</button>
    </div>
    <div class="queue-list" id="queue-list"></div>
  </aside>

  <aside class="queue-drawer" id="dl-drawer" hidden>
    <div class="queue-head">
      <div class="q-title-lg">Downloads</div>
      <button class="icon-btn" id="dl-close" aria-label="Close downloads">&times;</button>
    </div>
    <div class="queue-list" id="dl-list"></div>
  </aside>

  <footer class="playerbar" id="playerbar">
    <div class="pb-left">
      <div class="pb-art ph" id="pb-art">--</div>
      <div class="pb-meta">
        <div class="pb-title" id="pb-title"></div>
        <div class="pb-artist" id="pb-artist"></div>
        <div class="pb-status" id="pb-status" role="status" aria-live="polite" hidden></div>
      </div>
      <button class="pb-like" id="pb-like" title="Like">&#9825;</button>
      <button class="pb-menu icon-btn" id="pb-menu" title="Track options" aria-label="Track options">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
      <div class="pb-badge" id="pb-badge" hidden></div>
    </div>
    <div class="pb-center">
      <div class="pb-controls">
        <button class="ctl sm" id="shuffle" title="shuffle" aria-pressed="false">&#8646;</button>
        <button class="ctl" id="prev" title="previous">&#9198;</button>
        <button class="ctl main" id="toggle" title="play / pause">&#9654;</button>
        <button class="ctl" id="next" title="next">&#9197;</button>
        <button class="ctl sm" id="repeat" title="repeat" aria-pressed="false">&#8635;</button>
      </div>
      <div class="pb-progress">
        <span class="time" id="t-cur">0:00</span>
        <div class="bar" id="bar"><div class="bar-fill" id="bar-fill"></div></div>
        <span class="time" id="t-dur">0:00</span>
      </div>
    </div>
    <div class="pb-right">
      <input class="vol" id="vol" type="range" min="0" max="100" value="90" title="volume">
    </div>
  </footer>

  <div class="mini" id="mini" hidden>
    <div class="mini-art ph" id="mini-art">--</div>
    <div class="mini-meta">
      <div class="mini-title" id="mini-title"></div>
      <div class="mini-artist" id="mini-artist"></div>
      <div class="pb-status mini-status" id="mini-status" role="status" aria-live="polite" hidden></div>
    </div>
    <button class="mini-like" id="mini-like" aria-label="Like this track">&#9825;</button>
    <button class="ctl main sm-main" id="mini-toggle" aria-label="Play or pause">&#9654;</button>
  </div>

  <nav class="bottomnav">
<button class="bn-btn on" data-nav="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg>
      <span>Home</span></button>
    <button class="bn-btn" data-nav="search">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search</span></button>
    <button class="bn-btn" data-nav="askai">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5 13.9 9l5.6 1.9-5.6 1.9L12 18.5l-1.9-5.7L4.5 10.9 10.1 9z"/></svg>
      <span>A&amp;R</span></button>
    <button class="bn-btn" data-nav="songs">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="15" r="2.5"/><path d="M8.5 18V7l11-2v10"/></svg>
      <span>Library</span></button>
    <button class="bn-btn" data-nav="library">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16M9 4v16M14 5l5 15"/></svg>
      <span>Playlists</span></button>
    <button class="bn-btn" data-nav="djexport">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
      <span>Prep</span></button>
    <button class="bn-btn" data-nav="settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3.2M12 18.2v3.2M2.6 12h3.2M18.2 12h3.2M5 5l2.3 2.3M16.7 16.7 19 19M19 5l-2.3 2.3M7.3 16.7 5 19"/></svg>
      <span class="bn-label">Settings</span>
    </button>
  </nav>

  <section class="np" id="np" hidden>
    <div class="np-bg"><img id="np-bg-img" alt=""></div>
    <header class="np-head">
      <button class="icon-btn" id="np-close" aria-label="Close">&#9662;</button>
      <div class="np-stack">
        <div class="np-kicker">PLAYING FROM</div>
        <div class="np-ctx" id="np-ctx"></div>
      </div>
    </header>
    <div class="np-art-wrap"><div class="np-art ph" id="np-art">--</div></div>
    <div class="np-info">
      <div class="np-info-text">
        <div class="np-title" id="np-title"></div>
        <button class="np-artist alink" id="np-artist"></button>
        <button class="np-album alink" id="np-album"></button>
        <div class="pb-status np-status" id="np-status" role="status" aria-live="polite" hidden></div>
      </div>
      <button class="icon-btn np-add" id="np-add" aria-label="Add to a playlist">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      </button>
      <button class="np-like" id="np-like" aria-label="Like this track">&#9825;</button>
    </div>
    <div class="np-badge" id="np-badge" hidden></div>
    <div class="np-progress">
      <span class="time" id="np-cur">0:00</span>
      <div class="bar" id="np-bar"><div class="bar-fill" id="np-bar-fill"></div></div>
      <span class="time" id="np-dur">0:00</span>
    </div>
    <div class="np-volume">
      <button class="icon-btn np-mute-btn" id="np-mute" aria-label="Mute">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="wave" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <input class="vol" id="np-vol" type="range" min="0" max="100" value="90" aria-label="Volume">
    </div>
    <div class="np-controls">
      <button class="ctl sm" id="np-shuffle" aria-label="Shuffle">&#8646;</button>
      <button class="ctl big" id="np-prev" aria-label="Previous track">&#9198;</button>
      <button class="ctl main xl" id="np-toggle" aria-label="Play or pause">&#9654;</button>
      <button class="ctl big" id="np-next" aria-label="Next track">&#9197;</button>
      <button class="ctl sm" id="np-repeat" aria-label="Repeat">&#8635;</button>
    </div>
  </section>

  <div class="selbar" id="selbar" hidden>
    <span class="selcount" id="selcount"></span>
    <button class="btn btn-primary" id="sel-create">New playlist</button>
    <button class="btn btn-ghost" id="sel-add">Add to playlist</button>
    <button class="btn btn-ghost" id="sel-clear">Clear</button>
  </div>

  <div class="ctx" id="ctx"></div>
  <div id="ctx-bg" hidden></div>
  <div class="toasts" id="toasts"></div>

</div>
<audio id="audio" preload="none"></audio>
<script src="/app.js?v=473"></script>
</body>
</html>
